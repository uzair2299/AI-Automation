version: '3.8'

services:
  k8s-sre-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k8s-sre-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - LOG_LEVEL=INFO
      - K8S_ALLOW_CONFIGMAP_VALUES=false
      - KUBECONFIG=/root/.kube/config
    volumes:
      - ~/.kube:/root/.kube:ro
