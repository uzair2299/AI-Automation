apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-sre-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-sre-mcp
    app.kubernetes.io/component: sre-agent-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-sre-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-sre-mcp
    spec:
      serviceAccountName: k8s-sre-mcp-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: k8s-sre-mcp
          image: smiota/k8s-sre-mcp:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "INFO"
            - name: K8S_ALLOW_CONFIGMAP_VALUES
              value: "false"
          ports:
            - name: http-mcp
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

