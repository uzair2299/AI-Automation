<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third-Party Host Demonstration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-12">
    <div class="max-w-3xl mx-auto text-center py-20">
        <h1 class="text-4xl font-extrabold mb-4">Sample Host Website</h1>
        <p class="text-slate-400 mb-8">This page demonstrates embedding the Smiota AI Chatbot with the script tag below:</p>
        <div class="bg-slate-800 p-4 rounded-xl text-left text-xs font-mono text-indigo-300 overflow-x-auto mb-8 border border-slate-700">
            &lt;script src="http://localhost:8000/embed/embed.js" data-server="http://localhost:8000"&gt;&lt;/script&gt;
        </div>
        <p class="text-sm text-slate-500">Look at the bottom right corner for the floating chatbot button!</p>
    </div>

    <!-- Embed the chatbot via embed.js -->
    <script src="./embed.js" data-server="http://localhost:8000"></script>
</body>
</html>
