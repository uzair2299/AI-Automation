<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .actor-box { rx: 10px; ry: 10px; }
      .actor-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .lifeline { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .arrow { stroke-width: 1.8; fill: none; }
      .arrow-req { stroke: #818cf8; marker-end: url(#arrow-head-req); }
      .arrow-resp { stroke: #38bdf8; stroke-dasharray: 5 4; marker-end: url(#arrow-head-resp); }
      .arrow-err { stroke: #f87171; stroke-dasharray: 5 4; marker-end: url(#arrow-head-err); }
      .msg-num { fill: #c7d2fe; font-size: 11px; font-weight: 700; }
      .msg-text { fill: #e2e8f0; font-size: 12.5px; font-weight: 500; }
      .note-box { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 6; }
      .note-text { fill: #cbd5e1; font-size: 11.5px; font-style: italic; }
      .alt-box { fill: #1e293b; fill-opacity: 0.5; stroke: #4f46e5; stroke-width: 1.2; rx: 8; }
      .alt-label { fill: #a5b4fc; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .alt-divider { stroke: #475569; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrow-head-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrow-head-resp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <linearGradient id="actor-grad-host" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="actor-grad-iframe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="actor-grad-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="actor-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="actor-grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="50" y="42" class="title">Chatbot Guest Mode Sequence Diagram</text>
  <text x="50" y="64" class="subtitle">Public Concierge Responses vs. Gated Personal Resident Queries (No Token Provided)</text>

  <!-- Lifeline Columns (X Coordinates) -->
  <!-- User: 90, Host: 290, Iframe: 510, API: 730, AI: 910 -->
  <line x1="90" y1="120" x2="90" y2="700" class="lifeline"/>
  <line x1="290" y1="120" x2="290" y2="700" class="lifeline"/>
  <line x1="510" y1="120" x2="510" y2="700" class="lifeline"/>
  <line x1="730" y1="120" x2="730" y2="700" class="lifeline"/>
  <line x1="910" y1="120" x2="910" y2="700" class="lifeline"/>

  <!-- Top Actor Boxes -->
  <g transform="translate(15, 82)">
    <rect width="150" height="42" fill="url(#actor-grad-user)" class="actor-box"/>
    <text x="75" y="21" class="actor-text">👤 Visitor / Resident</text>
  </g>
  <g transform="translate(205, 82)">
    <rect width="170" height="42" fill="url(#actor-grad-host)" class="actor-box"/>
    <text x="85" y="21" class="actor-text">Public Website / Host</text>
  </g>
  <g transform="translate(425, 82)">
    <rect width="170" height="42" fill="url(#actor-grad-iframe)" class="actor-box"/>
    <text x="85" y="21" class="actor-text">Chatbot Iframe</text>
  </g>
  <g transform="translate(645, 82)">
    <rect width="170" height="42" fill="url(#actor-grad-api)" class="actor-box"/>
    <text x="85" y="21" class="actor-text">FastAPI Backend</text>
  </g>
  <g transform="translate(825, 82)">
    <rect width="170" height="42" fill="url(#actor-grad-ai)" class="actor-box"/>
    <text x="85" y="21" class="actor-text" font-size="12px">AI Agent &amp; Knowledge Base</text>
  </g>

  <!-- Step 1: User Opens Chatbot on Public Host -->
  <g transform="translate(0, 160)">
    <line x1="90" y1="0" x2="285" y2="0" class="arrow arrow-req"/>
    <text x="96" y="-10" class="msg-num">1</text>
    <text x="114" y="-10" class="msg-text">Visits public site &amp; opens Chatbot Widget</text>
  </g>

  <!-- Step 2: Host Embeds Iframe without Token -->
  <g transform="translate(0, 205)">
    <line x1="290" y1="0" x2="505" y2="0" class="arrow arrow-req"/>
    <text x="296" y="-10" class="msg-num">2</text>
    <text x="314" y="-10" class="msg-text">Embeds iframe (No token in URL, no postMessage)</text>
  </g>

  <!-- Note: Iframe enters Guest Mode -->
  <g transform="translate(410, 230)">
    <rect width="200" height="30" class="note-box" style="stroke:#f59e0b; fill:#451a03/30;"/>
    <text x="100" y="19" text-anchor="middle" fill="#fde68a" font-size="11.5px" font-weight="600">Enters Guest Mode (No Token)</text>
  </g>

  <!-- Alt Box: Public Inquiry vs Protected Inquiry -->
  <g transform="translate(70, 285)">
    <rect width="870" height="395" class="alt-box" style="stroke:#6366f1; fill:#0f172a; fill-opacity:0.8;"/>
    <text x="20" y="22" fill="#818cf8" font-size="11.5px" font-weight="700">ALT: QUERY TYPE CLASSIFICATION IN GUEST MODE</text>

    <!-- ================= SUB-SCENARIO 1: PUBLIC QUERY ================= -->
    <text x="20" y="44" fill="#38bdf8" font-size="11px" font-weight="700">[SCENARIO A: PUBLIC INQUIRY (ALLOWED)]</text>
    
    <!-- 3a: User asks public question -->
    <g transform="translate(0, 68)">
      <line x1="20" y1="0" x2="435" y2="0" class="arrow arrow-req"/>
      <text x="25" y="-9" class="msg-num">3a</text>
      <text x="45" y="-9" class="msg-text">"What are the locker room hours in Building A?"</text>
    </g>

    <!-- 4a: Iframe forwards query without Bearer token -->
    <g transform="translate(0, 108)">
      <line x1="440" y1="0" x2="655" y2="0" class="arrow arrow-req"/>
      <text x="445" y="-9" class="msg-num">4a</text>
      <text x="465" y="-9" class="msg-text">POST /api/v1/chat (No Bearer Header, channel: webchat)</text>
    </g>

    <!-- 5a: API to AI -->
    <g transform="translate(0, 144)">
      <line x1="660" y1="0" x2="835" y2="0" class="arrow arrow-req"/>
      <text x="665" y="-9" class="msg-num">5a</text>
      <text x="685" y="-9" class="msg-text">Knowledge Retrieval: Public locker hours &amp; locations</text>
      <line x1="835" y1="20" x2="665" y2="20" class="arrow arrow-resp"/>
      <text x="685" y="34" font-size="11px" fill="#7dd3fc">Returns: "Building A lockers are accessible 24/7"</text>
    </g>

    <!-- 6a: Response back to User -->
    <g transform="translate(0, 196)">
      <line x1="660" y1="0" x2="445" y2="0" class="arrow arrow-resp"/>
      <text x="455" y="-9" class="msg-num">6a</text>
      <text x="475" y="-9" class="msg-text">200 OK: Informational Answer</text>
      <line x1="440" y1="20" x2="25" y2="20" class="arrow arrow-resp"/>
      <text x="45" y="34" font-size="11.5px" fill="#7dd3fc">Displays answer + suggested action buttons</text>
    </g>

    <!-- ================= DIVIDER ================= -->
    <line x1="0" y1="230" x2="870" y2="230" class="alt-divider" style="stroke:#f87171;"/>
    
    <!-- ================= SUB-SCENARIO 2: PROTECTED QUERY ================= -->
    <text x="20" y="252" fill="#f87171" font-size="11px" font-weight="700">[SCENARIO B: PROTECTED PERSONAL QUERY (GATED)]</text>

    <!-- 3b: User asks protected question -->
    <g transform="translate(0, 276)">
      <line x1="20" y1="0" x2="435" y2="0" class="arrow arrow-req"/>
      <text x="25" y="-9" class="msg-num">3b</text>
      <text x="45" y="-9" class="msg-text">"What is my pickup PIN?" or "Do I have packages waiting?"</text>
    </g>

    <!-- 4b: Iframe forwards to API -->
    <g transform="translate(0, 314)">
      <line x1="440" y1="0" x2="655" y2="0" class="arrow arrow-req"/>
      <text x="445" y="-9" class="msg-num">4b</text>
      <text x="465" y="-9" class="msg-text">POST /api/v1/chat (Intent: locker_pin / my_packages)</text>
    </g>

    <!-- 5b: Gating Decision -->
    <g transform="translate(0, 348)">
      <line x1="660" y1="0" x2="445" y2="0" class="arrow arrow-err"/>
      <text x="455" y="-9" class="msg-num" fill="#fca5a5">5b</text>
      <text x="475" y="-9" class="msg-text" fill="#fca5a5">Identifies Unauthenticated Guest: GATES REQUEST</text>
      
      <line x1="440" y1="22" x2="25" y2="22" class="arrow arrow-err"/>
      <text x="45" y="37" font-size="11.5px" fill="#fca5a5">"To check your packages or retrieve your PIN, please log in."</text>
    </g>
  </g>

  <!-- Bottom Actor Boxes -->
  <g transform="translate(15, 700)">
    <rect width="150" height="34" fill="url(#actor-grad-user)" class="actor-box"/>
    <text x="75" y="17" class="actor-text">👤 User</text>
  </g>
  <g transform="translate(205, 700)">
    <rect width="170" height="34" fill="url(#actor-grad-host)" class="actor-box"/>
    <text x="85" y="17" class="actor-text">Public Website</text>
  </g>
  <g transform="translate(425, 700)">
    <rect width="170" height="34" fill="url(#actor-grad-iframe)" class="actor-box"/>
    <text x="85" y="17" class="actor-text">Chatbot Iframe</text>
  </g>
  <g transform="translate(645, 700)">
    <rect width="170" height="34" fill="url(#actor-grad-api)" class="actor-box"/>
    <text x="85" y="17" class="actor-text">FastAPI Backend</text>
  </g>
  <g transform="translate(825, 700)">
    <rect width="170" height="34" fill="url(#actor-grad-ai)" class="actor-box"/>
    <text x="85" y="17" class="actor-text" font-size="12px">AI Agent &amp; Knowledge Base</text>
  </g>
</svg>
