[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smiota-common"
version = "0.1.0"
description = "Shared foundational models, logging, exceptions, and middleware for Smiota AI microservices."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Smiota Inc.", email = "dev@smiota.com" }]
dependencies = [
    "pydantic>=2.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smiota_common*"]

