version: "3.8"

services:
  # ============================================================================
  # Service 1: Client Gateway (Port 8000)
  # Owns all 4 ingress channels (Teams, WebChat embed/WS, Mobile, IDE),
  # intent routing, session state, and delegates to remote MCP servers & RAG.
  # Connects directly to host-installed PostgreSQL (pgvector) and Redis.
  # ============================================================================
  smiota-agent-gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: smiota-agent-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - MCP_REMOTE_ENABLED=true
      - MCP_REMOTE_FALLBACK=true
      - MCP_CLIENT_TIMEOUT_SECONDS=15.0
      - MCP_K8S_SERVER_URL=http://k8s-sre-mcp:8080
      - MCP_OBSERVABILITY_SERVER_URL=http://observability-mcp:8081
      - MCP_LOCKER_SERVER_URL=http://smart-locker-mcp:8082
      - RAG_SERVICE_URL=http://rag-service:8001
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://smiota_user:smaiops26devdb@host.docker.internal:5432/smiota_ai_dev}
    depends_on:
      - rag-service
      - k8s-sre-mcp
      - observability-mcp
    networks:
      - smiota-mesh

  # ============================================================================
  # Service 2: Kubernetes SRE MCP Server (Port 8080)
  # 37 Read-Only K8s inventory and troubleshooting tools with cluster RBAC.
  # ============================================================================
  k8s-sre-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: k8s-sre-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - MCP_TRANSPORT=streamable-http
      - LOG_LEVEL=INFO
    networks:
      - smiota-mesh

  # ============================================================================
  # Service 3: Observability MCP Server (Port 8081)
  # FastMCP server for Prometheus PromQL metrics & OpenSearch logs.
  # ============================================================================
  observability-mcp:
    build:
      context: ./mcp-observability
      dockerfile: Dockerfile
    container_name: observability-mcp
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8081
      - MCP_TRANSPORT=streamable-http
      - PROMETHEUS_URL=https://prometheus.int.smiotaapps.com
      - OPENSEARCH_URL=https://opensearch.int.smiotaapps.com:9200
    networks:
      - smiota-mesh

  # ============================================================================
  # Service 4: Smart Locker MCP Server (Port 8082)
  # Hardware solenoid actuation, compartment sensors, and internal AI APIs.
  # ============================================================================
  smart-locker-mcp:
    image: python:3.11-slim
    container_name: smart-locker-mcp
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8082
    command: >
      sh -c "pip install mcp httpx uvicorn && python -c '
      from mcp.server.mcpserver import MCPServer
      mcp = MCPServer(\"smart-locker-mcp\")
      @mcp.tool()
      def get_locker_status(locker_id: str = \"LOCKER-01\"): return {\"status\": \"ONLINE\", \"compartments_free\": 12}
      mcp.settings.host=\"0.0.0.0\"
      mcp.settings.port=8082
      mcp.run(transport=\"streamable-http\")
      '"
    networks:
      - smiota-mesh

  # ============================================================================
  # Service 5: Standalone RAG Service (Port 8001)
  # Simple, high-speed REST microservice for knowledge search and ingestion.
  # Connects directly to host-installed PostgreSQL with pgvector.
  # ============================================================================
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - EMBEDDING_PROVIDER=deterministic
      - EMBEDDING_DIMENSION=768
      - VECTOR_STORE_BACKEND=pgvector
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://smiota_user:smaiops26devdb@host.docker.internal:5432/smiota_ai_dev}
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_USER=smiota_user
      - POSTGRES_PASSWORD=smaiops26devdb
      - POSTGRES_DB=smiota_ai_dev
    networks:
      - smiota-mesh

networks:
  smiota-mesh:
    driver: bridge
