<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .box { rx: 10px; ry: 10px; stroke-width: 1.5; }
      .box-title { fill: #ffffff; font-size: 13.5px; font-weight: 700; }
      .box-desc { fill: #cbd5e1; font-size: 11.5px; }
      .code-pill { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; }
      .badge-auth { fill: #10b981; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .badge-guest { fill: #f59e0b; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .line-flow { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="44" class="title">Smiota Chatbot: Authentication &amp; Guest Mode Architecture</text>
  <text x="40" y="68" class="subtitle">Handling Authenticated Sessions vs. Unauthenticated Guest Visitors When No Token is Provided</text>

  <!-- Step 1: Parent App Loads Iframe -->
  <g transform="translate(340, 95)">
    <rect width="320" height="66" fill="#1e293b" stroke="#475569" class="box"/>
    <text x="160" y="27" text-anchor="middle" class="box-title">Parent Application Embeds &lt;iframe&gt;</text>
    <text x="160" y="48" text-anchor="middle" class="box-desc">Mailroom WebApp, Resident Portal, or Public Website</text>
  </g>

  <!-- Flow to Decision Fork -->
  <path d="M 500 161 L 500 200" stroke="#64748b" class="line-flow"/>
  
  <!-- Decision Fork Diamond -->
  <g transform="translate(370, 200)">
    <polygon points="130,0 260,38 130,76 0,38" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.8"/>
    <text x="130" y="32" text-anchor="middle" fill="#e0e7ff" font-size="12px" font-weight="700">Does Parent Provide Token?</text>
    <text x="130" y="50" text-anchor="middle" fill="#a5b4fc" font-size="11px">(via postMessage OR ?code= fallback)</text>
  </g>

  <!-- Branch Left: Token Provided (YES) -->
  <path d="M 370 238 L 230 238 L 230 305" stroke="#818cf8" class="line-flow" marker-end="url(#arr-indigo)"/>
  <rect x="238" y="222" width="120" height="22" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
  <text x="298" y="237" text-anchor="middle" fill="#c7d2fe" font-size="11px" font-weight="700">YES (Token Provided)</text>

  <!-- Authenticated Exchange Card -->
  <g transform="translate(80, 305)">
    <rect width="300" height="135" fill="#1e293b" stroke="#6366f1" class="box"/>
    <rect x="16" y="14" width="135" height="22" rx="11" fill="#4338ca/30" stroke="#6366f1/50"/>
    <text x="83" y="29" class="badge-auth" fill="#818cf8">Token Exchange Flow</text>
    
    <text x="16" y="58" class="box-title">POST /api/v1/auth/exchange</text>
    <text x="16" y="78" class="box-desc">• Consumes bootstrap / session token</text>
    <text x="16" y="96" class="box-desc">• Validates user identity &amp; tenant</text>
    <text x="16" y="114" class="box-desc">• Issues signed JWT chat session token</text>
  </g>

  <!-- Authenticated Session Result -->
  <path d="M 230 440 L 230 495" stroke="#34d399" class="line-flow" marker-end="url(#arr-emerald)"/>
  
  <g transform="translate(80, 495)">
    <rect width="300" height="135" fill="#064e3b/40" stroke="#10b981" class="box"/>
    <text x="150" y="28" text-anchor="middle" fill="#34d399" font-size="13px" font-weight="700">✅ Authenticated Resident Session</text>
    <text x="20" y="56" fill="#a7f3d0" font-size="11.5px">• Full access to private pickup PINs</text>
    <text x="20" y="76" fill="#a7f3d0" font-size="11.5px">• Real-time personal delivery tracking</text>
    <text x="20" y="96" fill="#a7f3d0" font-size="11.5px">• Remote locker compartment unlock</text>
    <text x="20" y="116" fill="#a7f3d0" font-size="11.5px">• Support ticket creation under resident ID</text>
  </g>

  <!-- Branch Right: No Token Provided (NO) -->
  <path d="M 630 238 L 730 238 L 730 305" stroke="#f59e0b" class="line-flow" marker-end="url(#arr-amber)"/>
  <rect x="636" y="222" width="180" height="22" rx="4" fill="#451a03" stroke="#b45309"/>
  <text x="726" y="237" text-anchor="middle" fill="#fde68a" font-size="11px" font-weight="700">NO (No Token / Public Site)</text>

  <!-- Guest Mode Core Card -->
  <g transform="translate(560, 305)">
    <rect width="340" height="135" fill="#1e293b" stroke="#f59e0b" class="box"/>
    <rect x="16" y="14" width="135" height="22" rx="11" fill="#78350f/40" stroke="#f59e0b/50"/>
    <text x="83" y="29" class="badge-guest">Graceful Guest Mode</text>
    
    <text x="16" y="58" class="box-title">Unauthenticated Visitor Session</text>
    <text x="16" y="78" class="box-desc">• Chatbot loads smoothly with zero errors</text>
    <text x="16" y="96" class="box-desc">• Operates as helpful public locker concierge</text>
    <text x="16" y="114" class="box-desc">• AI intent classifier gates sensitive queries</text>
  </g>

  <!-- Branching under Guest Mode -->
  <path d="M 670 440 L 670 470 L 550 470 L 550 495" stroke="#38bdf8" class="line-flow" marker-end="url(#arr-sky)"/>
  <path d="M 790 440 L 790 470 L 840 470 L 840 495" stroke="#f87171" class="line-flow" marker-end="url(#arr-rose)"/>

  <!-- Guest Mode Sub-Branch 1: Public Queries Allowed -->
  <g transform="translate(430, 495)">
    <rect width="240" height="135" fill="#0c4a6e/40" stroke="#38bdf8" class="box"/>
    <text x="120" y="24" text-anchor="middle" fill="#38bdf8" font-size="12px" font-weight="700">🌐 Public Queries (Allowed)</text>
    <text x="14" y="48" fill="#bae6fd" font-size="11px">• Locker operating hours &amp; rules</text>
    <text x="14" y="68" fill="#bae6fd" font-size="11px">• Building locker bank locations</text>
    <text x="14" y="88" fill="#bae6fd" font-size="11px">• How to pick up / drop off parcels</text>
    <text x="14" y="108" fill="#bae6fd" font-size="11px">• Tracking number status (Masked)</text>
    <text x="14" y="124" fill="#7dd3fc" font-size="11px" font-weight="600">↳ Answered immediately by AI</text>
  </g>

  <!-- Guest Mode Sub-Branch 2: Protected Queries Gated -->
  <g transform="translate(690, 495)">
    <rect width="280" height="135" fill="#4c0519/40" stroke="#f87171" class="box"/>
    <text x="140" y="24" text-anchor="middle" fill="#f87171" font-size="12px" font-weight="700">🔒 Personal / Protected Queries (Gated)</text>
    <text x="14" y="48" fill="#fecdd3" font-size="11px">• "What is my pickup PIN?"</text>
    <text x="14" y="68" fill="#fecdd3" font-size="11px">• "Do I have any packages waiting?"</text>
    <text x="14" y="88" fill="#fecdd3" font-size="11px">• "Unlock my locker compartment"</text>
    <text x="14" y="112" fill="#fca5a5" font-size="11px" font-weight="600">↳ Gated: "To check your packages or</text>
    <text x="24" y="126" fill="#fca5a5" font-size="10.5px">retrieve your PIN, please log in to portal."</text>
  </g>
</svg>
