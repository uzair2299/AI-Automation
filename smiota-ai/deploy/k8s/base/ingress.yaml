apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smiota-agent-core-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "smiota-ssl-cert"
spec:
  rules:
    - host: ai.smiota.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smiota-agent-core-service
                port:
                  number: 80
