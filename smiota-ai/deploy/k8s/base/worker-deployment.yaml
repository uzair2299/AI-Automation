apiVersion: apps/v1
kind: Deployment
metadata:
  name: smiota-agent-core-worker
  labels:
    app: smiota-agent-core
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smiota-agent-core
      component: worker
  template:
    metadata:
      labels:
        app: smiota-agent-core
        component: worker
    spec:
      containers:
        - name: worker
          image: gcr.io/smiota-cloud-prod/smiota-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "smiota.workflows.engine"]
          envFrom:
            - configMapRef:
                name: smiota-config
            - secretRef:
                name: smiota-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
