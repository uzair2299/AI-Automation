apiVersion: apps/v1
kind: Deployment
metadata:
  name: smiota-agent-core-api
  labels:
    app: smiota-agent-core
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smiota-agent-core
      component: api
  template:
    metadata:
      labels:
        app: smiota-agent-core
        component: api
    spec:
      containers:
        - name: api
          image: gcr.io/smiota-cloud-prod/smiota-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: smiota-config
            - secretRef:
                name: smiota-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: smiota-agent-core-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: smiota-agent-core
    component: api
