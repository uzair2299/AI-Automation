# =============================================================================
# Production Profile Configuration (application-prod.properties)
# =============================================================================

# Production Database via Environment Variables (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:10.128.15.219}:${DB_PORT:3306}/${DB_NAME:usman-db-sdev2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:usman-db-sdev2}
spring.datasource.password=${DB_PASSWORD:Usman@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# High Performance Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=ProdHikariCP

# JPA / Hibernate (No auto-DDL)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway Production Migrations Disabled
spring.flyway.enabled=false

# Security (Production Secret via Environment)
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Actuator Health endpoint restricted
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Logging
logging.level.root=WARN
logging.level.com.company.starter=INFO
logging.level.org.springframework.security=WARN
