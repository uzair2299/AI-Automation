# =============================================================================
# Development Profile Configuration (application-dev.properties)
# =============================================================================

# MySQL DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:10.128.15.219}:${DB_PORT:3306}/${DB_NAME:usman-db-sdev2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:usman-db-sdev2}
spring.datasource.password=${DB_PASSWORD:Usman@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=DevHikariCP

# JPA / Hibernate (No auto-DDL, connect directly to existing DB)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway Migrations Disabled
spring.flyway.enabled=false

# Logging
logging.level.com.company.starter=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
