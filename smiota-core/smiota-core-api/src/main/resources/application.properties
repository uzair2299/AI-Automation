# =============================================================================
# Base Application Properties
# =============================================================================

spring.application.name=enterprise-starter
application.name=enterprise-starter
server.port=9090
server.servlet.context-path=/

# Logback Rolling Properties
logging.rolling.file=/SpringBootVolume/logs/enterprise-starter-%d{yyyy-MM-dd}.log
logging.rolling.file.max.history=30
logging.rolling.file.max.size=1GB

# HTTP Request & Response Payload Logging Configuration
logging.http.payload.enabled=true
logging.http.payload.max-length=10000
logging.http.payload.include-headers=true

# Active Profile (defaults to dev)
spring.profiles.active=dev

# Jackson JSON Serialization
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Security Configuration
# 256-bit cryptographically secure default secret key
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 Hours in milliseconds
application.security.jwt.expiration=86400000
# Refresh Expiration: 7 Days in milliseconds
application.security.jwt.refresh-token.expiration=604800000

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs

# Hibernate Configuration (Disabled auto-DDL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway Migrations (Disabled - Existing DB)
spring.flyway.enabled=false

# Security Data Seeder (Disabled by default to avoid altering existing DB)
application.security.seeder.enabled=false

